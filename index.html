<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Discord Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fee2e2;
  }
  .container {
    width: 94%;
    max-width: 560px;
    padding: 30px;
    background: linear-gradient(145deg, #1a0000, #000);
    border-radius: 20px;
    border: 1px solid #7f1d1d;
    box-shadow: 0 0 50px rgba(239, 68, 68, 0.3);
  }
  h1 {
    text-align: center;
    margin-bottom: 28px;
    font-size: 28px;
    background: linear-gradient(90deg, #fecaca, #ef4444, #7f1d1d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  label {
    display: block;
    margin-top: 20px;
    font-size: 15px;
    color: #fecaca;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    padding: 16px;
    border-radius: 14px;
    background: #000;
    color: #fee2e2;
    border: 1px solid #7f1d1d;
    outline: none;
    font-size: 15px;
    resize: vertical;
    height: 160px;
    font-family: monospace;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 18px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #dc2626, #ef4444, #7f1d1d);
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .log {
    margin-top: 24px;
    padding: 16px;
    background: #111;
    border-radius: 14px;
    border: 1px solid #7f1d1d;
    max-height: 260px;
    overflow-y: auto;
    font-size: 14px;
    color: #fecaca;
    line-height: 1.6;
    font-family: monospace;
  }
  .status-valid {
    color: #86efac;
    font-weight: bold;
  }
  .status-invalid {
    color: #fca5a5;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Discord Token Checker</h1>

  <label for="tokens">チェックしたいトークン（1行に1つ、複数可）</label>
  <textarea id="tokens" placeholder="ここにDiscordのユーザーアカウントトークンを貼り付けてください&#10;例:&#10;mfa.VkO_2G4Qv3T-- NOPE --&#10;NTg3ODIyMzQ1Njc4OTA0NjQw.Gabcde.1234567890abcdef"></textarea>

  <button id="checkBtn" onclick="checkTokens()">実行</button>

  <div class="log" id="log"></div>
</div>

<script>
const tokensEl = document.getElementById("tokens");
const logEl = document.getElementById("log");
const checkBtn = document.getElementById("checkBtn");

function now() {
  const d = new Date();
  return `[${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}]`;
}

function log(text) {
  logEl.innerHTML += `${now()} ${text}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function checkSingleToken(token) {
  const url = "https://discord.com/api/v10/users/@me";

  try {
    const response = await fetch(url, {
      headers: {
        "Authorization": token.trim(),
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
      }
    });

    if (response.status === 200) {
      const data = await response.json();
      const username = data.username ? `${data.username}#${data.discriminator || '0'}` : "不明なユーザー";
      return { valid: true, username };
    } else if (response.status === 401) {
      return { valid: false, reason: "無効なトークン" };
    } else if (response.status === 403) {
      return { valid: false, reason: "凍結または無効化されたアカウント" };
    } else {
      return { valid: false, reason: `エラー ${response.status}` };
    }
  } catch (err) {
    return { valid: false, reason: "ネットワークエラー" };
  }
}

async function checkTokens() {
  logEl.innerHTML = "";
  checkBtn.disabled = true;
  checkBtn.textContent = "チェック中...";

  const rawInput = tokensEl.value.trim();
  if (!rawInput) {
    log("❌ トークンが入力されていません");
    checkBtn.disabled = false;
    checkBtn.textContent = "実行";
    return;
  }

  const tokens = rawInput
    .split("\n")
    .map(t => t.trim())
    .filter(t => t.length > 20);

  if (tokens.length === 0) {
    log("❌ 有効そうなトークンがありません");
    checkBtn.disabled = false;
    checkBtn.textContent = "実行";
    return;
  }

  log(`✅ ${tokens.length}件のトークンをチェック開始`);

  for (let i = 0; i < tokens.length; i++) {
    const token = tokens[i];
    const shortToken = token.slice(0, 20) + "...";

    log(`[${i + 1}/${tokens.length}] チェック中: ${shortToken}`);

    const result = await checkSingleToken(token);

    if (result.valid) {
      log(`<span class="status-valid">✅ このトークンは有効です → ${result.username}</span>`);
    } else {
      log(`<span class="status-invalid">❌ このトークンは無効です (${result.reason})</span>`);
    }

    if (i < tokens.length - 1) {
      await new Promise(r => setTimeout(r, 800));
    }
  }

  log("🏁 すべてのチェックが完了しました");
  checkBtn.disabled = false;
  checkBtn.textContent = "実行";
}
</script>
</body>
</html>
